<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Background Tile -->
    <rect width="100" height="100" rx="22" fill="#171717"/>
    
    <!-- Train Body -->
    <rect x="28" y="22" width="44" height="56" rx="12" fill="none" stroke="#f4f4f0" stroke-width="5"/>
    
    <!-- Windshield / Window -->
    <rect x="36" y="32" width="28" height="18" rx="4" fill="#f4f4f0"/>
    
    <!-- Headlights -->
    <circle cx="38" cy="62" r="3" fill="#10b981"/>
    <circle cx="62" cy="62" r="3" fill="#10b981"/>
    
    <!-- Center Track Line -->
    <line x1="50" y1="56" x2="50" y2="70" stroke="#f4f4f0" stroke-width="3" stroke-linecap="round"/>
</svg>
